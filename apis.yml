description: Nikahsatu is a Malaysian wedding-planning marketplace that helps couples plan and budget
  their weddings more easily and affordably. The consumer-facing platform curates venue packages across
  Kuala Lumpur, Selangor, Johor, Melaka, Penang and other Malaysian states, along with wedding vendor
  services such as digital and printed invitations, photography and videography, traditional songket
  attire, and custom gift boxes, bundled into coordinated all-in-one wedding packages with promotional
  rebates. It is built on WordPress/WooCommerce and surfaced in the API Evangelist network as a
  portfolio company of 500 Global. As of this enrichment pass Nikahsatu publishes no public API,
  developer portal, or machine-readable API surface.
